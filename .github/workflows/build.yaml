name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v3
        with:
          name: MyApp-mac
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npm run dist -- --win

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v3
        with:
          name: MyApp-win
          path: dist/*.exe
